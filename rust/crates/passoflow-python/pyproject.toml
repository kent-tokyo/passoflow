[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "passoflow"
version = "0.1.3"
description = "Python bindings for PassoFlow's Rust scenario contracts"
license = "MIT OR Apache-2.0"
readme = "README.md"
requires-python = ">=3.9"

[tool.maturin]
module-name = "passoflow_python"
bindings = "pyo3"
features = ["extension-module"]
python-source = "python"
