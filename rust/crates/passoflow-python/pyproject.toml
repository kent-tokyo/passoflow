[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "passoflow-python"
version = "0.1.2"
description = "Python bindings for PassoFlow's Rust scenario contracts"
requires-python = ">=3.9"

[tool.maturin]
module-name = "passoflow_python"
bindings = "pyo3"
features = ["extension-module"]
