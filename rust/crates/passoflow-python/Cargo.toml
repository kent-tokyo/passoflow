[package]
name = "passoflow-python"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
description = "Python bindings for PassoFlow's Rust scenario contracts"
repository.workspace = true
readme = "README.md"
[lib]
name = "passoflow_python"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
passoflow-core = { version = "0.1.2", path = "../passoflow-core" }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
serde_json = "1"
