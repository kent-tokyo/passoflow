[workspace]
resolver = "2"
members = [
    "crates/passoflow",
    "crates/passoflow-core",
    "crates/passoflow-input",
    "crates/passoflow-capture",
    "crates/passoflow-vision",
    "crates/passoflow-web",
    "crates/passoflow-engine",
    "crates/passoflow-python",
    "crates/passoflow-server",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "Rust engine components for PassoFlow local automation"
repository = "https://github.com/kent-tokyo/passoflow"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
collapsible_if = { level = "allow", priority = 1 }
