name: Publish passoflow umbrella crate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-preflight:
    name: Check umbrella version metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify VERSION and Cargo metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          grep -qx "version = \"$version\"" rust/Cargo.toml
          grep -qx "version = \"$version\"" rust/crates/passoflow/Cargo.toml

  publish:
    name: Publish passoflow
    needs: version-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish passoflow umbrella crate
        run: cargo publish --manifest-path rust/crates/passoflow/Cargo.toml --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
