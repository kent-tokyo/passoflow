name: Publish passoflow umbrella crate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish passoflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish passoflow umbrella crate
        run: cargo publish --manifest-path rust/crates/passoflow/Cargo.toml --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
