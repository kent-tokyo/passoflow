name: Publish Rust crates

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-preflight:
    name: Check Rust crate version metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify VERSION and Cargo metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          grep -qx "version = \"$version\"" rust/Cargo.toml
          grep -qx "version.workspace = true" rust/crates/passoflow-core/Cargo.toml
          grep -qx "version = \"$version\"" rust/crates/passoflow-python/Cargo.toml

  publish:
    name: Publish passoflow-core and passoflow-python
    needs: version-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --manifest-path rust/crates/passoflow-core/Cargo.toml --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish Python binding after core is indexed
        shell: bash
        run: |
          for attempt in {1..12}; do
            if cargo publish --manifest-path rust/crates/passoflow-python/Cargo.toml --locked; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            echo "passoflow-core is not visible to the registry yet; retrying in 10 seconds (attempt $attempt/12)"
            sleep 10
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
