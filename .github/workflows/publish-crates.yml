name: Publish Rust crates

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-preflight:
    name: Check Rust crate version metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify VERSION and Cargo metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          grep -qx "version = \"$version\"" rust/Cargo.toml
          grep -qx "version.workspace = true" rust/crates/passoflow-core/Cargo.toml
          grep -qx "version = \"$version\"" rust/crates/passoflow-python/Cargo.toml

  publish:
    name: Publish PassoFlow crates
    needs: version-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates in dependency order
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"

          wait_for_crate() {
            local crate="$1"
            for attempt in {1..12}; do
              if cargo info "${crate}@${version}" >/dev/null 2>&1; then
                return 0
              fi
              echo "${crate}@${version} is not visible to the registry yet; retrying in 10 seconds (attempt ${attempt}/12)"
              sleep 10
            done
            echo "${crate}@${version} was not indexed in time" >&2
            return 1
          }

          publish_crate() {
            local crate="$1"
            local manifest="$2"
            if cargo publish --manifest-path "$manifest" --locked; then
              return 0
            fi
            echo "${crate}@${version} may already be published; verifying registry visibility"
            wait_for_crate "$crate"
          }

          publish_crate passoflow-core rust/crates/passoflow-core/Cargo.toml
          wait_for_crate passoflow-core
          publish_crate passoflow-input rust/crates/passoflow-input/Cargo.toml
          publish_crate passoflow-web rust/crates/passoflow-web/Cargo.toml
          wait_for_crate passoflow-web
          publish_crate passoflow-engine rust/crates/passoflow-engine/Cargo.toml
          wait_for_crate passoflow-engine

          # Python binding publication is intentionally last because its crate
          # depends on the published core, engine, input, and web contracts.
          publish_crate passoflow-python rust/crates/passoflow-python/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
