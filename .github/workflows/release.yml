name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-preflight:
    name: Check release version metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version files and release tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          grep -qx "version = \"$version\"" rust/Cargo.toml || {
            echo "rust workspace version does not match VERSION" >&2
            exit 1
          }
          grep -qx "version = \"$version\"" rust/crates/passoflow-python/Cargo.toml || {
            echo "passoflow-python version does not match VERSION" >&2
            exit 1
          }
          if [[ "${{ github.event_name }}" == "release" ]]; then
            test "${GITHUB_REF_NAME#v}" = "$version"
          fi

  wheels:
    name: Build wheel (${{ matrix.os }})
    needs: version-preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade maturin
      - run: maturin build --manifest-path rust/crates/passoflow-python/Cargo.toml --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build source distribution
    needs: version-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade maturin
      - run: maturin sdist --manifest-path rust/crates/passoflow-python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  package-smoke:
    name: Verify distributable artifacts
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-ubuntu-latest
          path: wheel
      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: sdist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and import Linux wheel in a clean environment
        shell: bash
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/python -m pip install --quiet --no-deps wheel/*.whl
          wheel-venv/bin/python - <<'PY'
          import json
          import passoflow_python

          assert passoflow_python.__version__
          assert passoflow_python.contract_version() == "0.1"
          assert hasattr(passoflow_python, "DomBrowser")
          assert hasattr(passoflow_python, "input_platform_info_json")
          assert hasattr(passoflow_python, "action_outcome_contract_json")
          outcome = json.loads(passoflow_python.action_outcome_contract_json("browser_click"))
          assert outcome["warning_continue"] is False
          schema = json.loads(passoflow_python.action_schema_json())
          assert schema["contract"] == "0.1"
          assert any(action["name"] == "browser_fill" for action in schema["actions"])
          result = json.loads(passoflow_python.validate_yaml("title: Smoke\nsteps: []\n"))
          assert result["valid"] is True
          PY
      - name: Check source distribution contents
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import tarfile

          archive = glob.glob("sdist/*.tar.gz")[0]
          with tarfile.open(archive) as package:
              names = package.getnames()
          assert any(name.endswith("/README.md") for name in names)
          assert any(name.endswith("/python/passoflow_python/__init__.pyi") for name in names)
          PY

  platform-wheel-smoke:
    name: Verify ${{ matrix.os }} wheel
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and import wheel
        shell: bash
        run: |
          python -m venv wheel-venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PYTHON=wheel-venv/Scripts/python
          else
            PYTHON=wheel-venv/bin/python
          fi
          "$PYTHON" -m pip install --quiet --no-deps wheel/*.whl
          "$PYTHON" - <<'PY'
          import json
          import passoflow_python

          assert passoflow_python.__version__
          assert passoflow_python.contract_version() == "0.1"
          assert hasattr(passoflow_python, "DomBrowser")
          assert hasattr(passoflow_python, "input_platform_info_json")
          assert hasattr(passoflow_python, "action_outcome_contract_json")
          outcome = json.loads(passoflow_python.action_outcome_contract_json("browser_click"))
          assert outcome["warning_continue"] is False
          schema = json.loads(passoflow_python.action_schema_json())
          assert schema["contract"] == "0.1"
          assert any(action["name"] == "browser_fill" for action in schema["actions"])
          result = json.loads(passoflow_python.validate_yaml("title: Smoke\nsteps: []\n"))
          assert result["valid"] is True
          PY

  publish:
    name: Publish to PyPI
    needs: [version-preflight, wheels, sdist, package-smoke, platform-wheel-smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
